# Native Pi workers run on your host. This isolated stack supplies storage only.
name: loom-book-summary
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: loom
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom-local-only
    ports:
      - "127.0.0.1:${LOOM_BOOK_PG_PORT:-15432}:5432"
    volumes:
      - book-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U loom -d loom"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  book-data:
