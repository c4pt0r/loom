name: loom-local

x-backend: &backend
  LOOM_DATABASE_URL: host=postgres port=5432 user=loom password=loom-local-only dbname=loom

x-node: &node
  image: loom-local:dev
  build:
    context: .
    target: runtime
  environment: *backend
  depends_on:
    postgres:
      condition: service_healthy
  init: true
  # Loom currently handles SIGINT for graceful draining.
  stop_signal: SIGINT
  stop_grace_period: 20s
  restart: "no"

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: loom
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom-local-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U loom -d loom"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Internal Compose network only; no collision with an existing host database.

  node-a:
    <<: *node
    command: [--namespace, "${LOOM_NAMESPACE:-lab}", node, --id, node-a, --lease-ms, "5000"]

  node-b:
    <<: *node
    command: [--namespace, "${LOOM_NAMESPACE:-lab}", node, --id, node-b, --lease-ms, "5000"]

  cli:
    <<: *node
    profiles: [tools]
    command: [--help]

  tests:
    image: loom-local-tests:dev
    build:
      context: .
      target: tests
    profiles: [tests]
    environment:
      <<: *backend
      LOOM_TEST_DATABASE_URL: host=postgres port=5432 user=loom password=loom-local-only dbname=loom
    depends_on:
      postgres:
        condition: service_healthy

  sort:
    <<: *node
    profiles: [tools]
    entrypoint: [/usr/local/bin/loom-sort-client]
    command: []
    environment:
      <<: *backend
      LOOM_NAMESPACE: "${LOOM_NAMESPACE:-lab}"

  # Helpers are only started by the acceptance harness, never by normal `up`.
  control:
    <<: *node
    profiles: [tests]
    entrypoint: [/bin/sleep]
    command: [infinity]

  claim-fixture:
    <<: *node
    profiles: [tests]
    entrypoint: [/usr/local/bin/hold-claim]
    command: ["${LOOM_NAMESPACE:-lab}"]

volumes:
  postgres-data:
